<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .title { font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: bold; fill: #193b3a; }
      .quad-label { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: bold; fill: #193b3a; }
      .quad-sub { font-family: 'DM Sans', sans-serif; font-size: 13px; fill: #647573; }
      .highlight-label { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .dir-badge { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#fffdf8" rx="20" />
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="#193b3a" stroke-width="2" stroke-opacity="0.2" rx="16" />

  <!-- Title Header -->
  <text x="400" y="60" text-anchor="middle" class="title">VASTU SHASTRA DIRECTIONAL ZONING: SEPTIC TANK (NORTH-WEST VAYU QUADRANT)</text>

  <!-- 3x3 Plot Matrix -->
  <!-- NW Quadrant (Vayuvyam) -->
  <rect x="100" y="100" width="200" height="200" fill="#ff725e" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="200" y="180" text-anchor="middle" class="highlight-label">NORTH-WEST (వాయువ్యం)</text>
  <text x="200" y="210" text-anchor="middle" class="highlight-label">Septic Tank Chamber (వాయువ్యం)</text>

  <!-- North Zone -->
  <rect x="300" y="100" width="200" height="200" fill="#f8fafc" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="400" y="190" text-anchor="middle" class="quad-label">NORTH (ఉత్తరం)</text>
  <text x="400" y="220" text-anchor="middle" class="quad-sub">Kuber / Wealth Flux</text>

  <!-- NE Quadrant (Eshanyam) -->
  <rect x="500" y="100" width="200" height="200" fill="#e0f2fe" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="600" y="180" text-anchor="middle" class="quad-label">NORTH-EAST (ఈశాన్యం)</text>
  <text x="600" y="210" text-anchor="middle" class="quad-sub">Water Element (Jala)</text>

  <!-- West Zone -->
  <rect x="100" y="300" width="200" height="200" fill="#f8fafc" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="200" y="390" text-anchor="middle" class="quad-label">WEST (పడమర)</text>
  <text x="200" y="420" text-anchor="middle" class="quad-sub">Varuna / Stability</text>

  <!-- Center Core (Brahmasthanam) -->
  <rect x="300" y="300" width="200" height="200" fill="#fef3c7" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="400" y="390" text-anchor="middle" class="quad-label">BRAHMASTHANAM (మధ్యభాగం)</text>
  <text x="400" y="420" text-anchor="middle" class="quad-sub">Space Element (Akasha - Keep Open)</text>

  <!-- East Zone -->
  <rect x="500" y="300" width="200" height="200" fill="#f8fafc" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="600" y="390" text-anchor="middle" class="quad-label">EAST (తూర్పు)</text>
  <text x="600" y="420" text-anchor="middle" class="quad-sub">Indra / Solar Ingress</text>

  <!-- SW Quadrant (Nairuthi) -->
  <rect x="100" y="500" width="200" height="200" fill="#fee2e2" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="200" y="580" text-anchor="middle" class="quad-label">SOUTH-WEST (నైరుతి)</text>
  <text x="200" y="610" text-anchor="middle" class="quad-sub">Earth Element (Prithvi - Heavy)</text>

  <!-- South Zone -->
  <rect x="300" y="500" width="200" height="200" fill="#f8fafc" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="400" y="590" text-anchor="middle" class="quad-label">SOUTH (దక్షిణం)</text>
  <text x="400" y="620" text-anchor="middle" class="quad-sub">Yama / Grounding</text>

  <!-- SE Quadrant (Agneyam) -->
  <rect x="500" y="500" width="200" height="200" fill="#ffedd5" stroke="#193b3a" stroke-width="2" rx="8" />
  <text x="600" y="580" text-anchor="middle" class="quad-label">SOUTH-EAST (ఆగ్నేయం)</text>
  <text x="600" y="610" text-anchor="middle" class="quad-sub">Fire Element (Agni)</text>

  <!-- Footer Citation -->
  <text x="400" y="740" text-anchor="middle" class="quad-sub">Certified Sthapatya Veda Grid Matrix • Dr. Kunchala Hanumantha Rao (HR Vasthu)</text>
</svg>